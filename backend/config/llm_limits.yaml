# LLM limits for batch_llm_client — update without code changes.
# Pricing: USD per 1M tokens from OpenRouter /api/v1/models (audit date 2026-09-18).
# Rate limits marked null are UNKNOWN (account-tier); refresh via GET /api/v1/key.

version: 1

defaults:
  safety_margin: 0.12
  max_retries: 5
  overlap_tokens: 80
  max_concurrency: 4
  mode: realtime  # realtime | async_batch | auto
  budget_usd_ceiling: null
  auto_batch_min_items: 20
  checkpoint_dir: data/batch_llm_checkpoints
  dead_letter_dir: data/batch_llm_dead_letter

# Alias → canonical OpenRouter id (keeps existing env values working)
aliases:
  claude-haiku-4-5: anthropic/claude-haiku-4.5
  claude-sonnet-5: anthropic/claude-sonnet-5
  anthropic/claude-sonnet-4: anthropic/claude-sonnet-4
  google/gemini-2.5-pro: google/gemini-2.5-pro
  google/gemini-2.5-flash: google/gemini-2.5-flash
  google/gemini-2.5-flash-image: google/gemini-2.5-flash-image
  perplexity/sonar-pro: perplexity/sonar-pro
  openai/gpt-5.6-sol: openai/gpt-5.6-sol

models:
  router:
    env_keys: [OPENROUTER_API_KEY, ANTHROPIC_API_KEY]
    settings_field: router_model
    openrouter_id: anthropic/claude-haiku-4.5
    anthropic_id: claude-haiku-4-5
    context_window: 200000
    max_output_tokens: 64000
    price_input_per_m: 1.0
    price_output_per_m: 5.0
    price_batch_multiplier: 0.5
    supports_batch: true
    supports_prompt_cache: true
    cache_min_tokens: 2048
    tokenizer: anthropic
    rpm: null
    tpm_in: null
    tpm_out: null
    notes: "Bare config id claude-haiku-4-5 maps here. Catalog id uses 4.5."

  skill:
    env_keys: [OPENROUTER_API_KEY, ANTHROPIC_API_KEY]
    settings_field: skill_model
    openrouter_id: anthropic/claude-sonnet-5
    anthropic_id: claude-sonnet-5
    context_window: 1000000
    max_output_tokens: 128000
    price_input_per_m: 2.0
    price_output_per_m: 10.0
    price_batch_multiplier: 0.5
    supports_batch: true
    supports_prompt_cache: true
    cache_min_tokens: 1024
    tokenizer: anthropic
    rpm: null
    tpm_in: null
    tpm_out: null
    notes: ".env.example may use anthropic/claude-sonnet-4 (ctx 1M, out 64k, $3/$15)."

  competitor:
    env_keys: [OPENROUTER_API_KEY]
    settings_field: competitor_model
    openrouter_id: google/gemini-2.5-pro
    context_window: 1048576
    max_output_tokens: 65536
    price_input_per_m: 1.25
    price_output_per_m: 10.0
    price_batch_multiplier: 0.5
    supports_batch: true
    supports_prompt_cache: true
    cache_min_tokens: 4096
    tokenizer: gemini_approx
    rpm: null
    tpm_in: null
    tpm_out: null

  research:
    env_keys: [OPENROUTER_API_KEY]
    settings_field: research_model
    openrouter_id: perplexity/sonar-pro
    context_window: 200000
    max_output_tokens: 8000
    price_input_per_m: 3.0
    price_output_per_m: 15.0
    price_batch_multiplier: null
    supports_batch: false
    supports_prompt_cache: false
    cache_min_tokens: null
    tokenizer: openrouter_usage_calibrated
    rpm: null
    tpm_in: null
    tpm_out: null
    notes: "No :batch variant found in OpenRouter catalog audit."

  write:
    env_keys: [OPENROUTER_API_KEY]
    settings_field: write_model
    openrouter_id: openai/gpt-5.6-sol
    context_window: 1050000
    max_output_tokens: 128000
    price_input_per_m: 2.0
    price_output_per_m: 10.0
    price_batch_multiplier: 0.5
    supports_batch: true
    supports_prompt_cache: true
    cache_min_tokens: 1024
    tokenizer: tiktoken_o200k
    rpm: null
    tpm_in: null
    tpm_out: null

  keyword_cluster:
    env_keys: [OPENROUTER_API_KEY]
    settings_field: keyword_cluster_model
    openrouter_id: google/gemini-2.5-flash
    context_window: 1048576
    max_output_tokens: 65535
    price_input_per_m: 0.30
    price_output_per_m: 2.50
    price_batch_multiplier: 0.5
    supports_batch: true
    supports_prompt_cache: true
    cache_min_tokens: 1024
    tokenizer: gemini_approx
    rpm: null
    tpm_in: null
    tpm_out: null

  image:
    env_keys: [OPENROUTER_API_KEY]
    settings_field: image_model
    openrouter_id: google/gemini-2.5-flash-image
    context_window: 32768
    max_output_tokens: 8192
    price_input_per_m: 0.30
    price_output_per_m: 2.50
    price_batch_multiplier: null
    supports_batch: false
    supports_prompt_cache: false
    cache_min_tokens: null
    tokenizer: gemini_approx
    rpm: null
    tpm_in: null
    tpm_out: null
    notes: "Image endpoint — not routed through chat Batch API."
