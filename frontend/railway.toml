# Railway config for a *separate* frontend-only service (Root Directory = frontend).
# Prefer the single root Dockerfile (API + SPA) on the Backend service instead.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Must override any inherited API startCommand (sh /start.sh).
startCommand = "/start-frontend.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
