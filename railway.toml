# Explicit Railway config for the API+SPA service (repo root).
# Do not set startCommand here — use the Dockerfile CMD so a frontend-only
# service cannot inherit `sh /start.sh` by mistake.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
